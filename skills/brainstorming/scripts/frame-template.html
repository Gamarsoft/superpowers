<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Superpowers Brainstorming</title>
    <style>
      /*
     * BRAINSTORM COMPANION FRAME TEMPLATE
     *
     * This template provides a consistent frame with:
     * - OS-aware light/dark theming
     * - Fixed header and selection indicator bar
     * - Scrollable main content area
     * - CSS helpers for common UI patterns
     *
     * Content is injected via placeholder comment in #claude-content.
     */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      /* ===== THEME VARIABLES ===== */
      :root {
        --bg-primary: #f5f5f7;
        --bg-secondary: #ffffff;
        --bg-tertiary: #e5e5e7;
        --border: #d1d1d6;
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
        --text-tertiary: #aeaeb2;
        --accent: #0071e3;
        --accent-hover: #0077ed;
        --success: #34c759;
        --warning: #ff9f0a;
        --error: #ff3b30;
        --selected-bg: #e8f4fd;
        --selected-border: #0071e3;
        --comparison-soft-bg: #f7f9fc;
        --comparison-soft-border: #d8ddea;
        --comparison-emphasis-bg: #edf5ff;
        --comparison-selected-shadow: 0 6px 18px rgba(0, 113, 227, 0.18);
        --comparison-card-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
      }

      /* @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1d1d1f;
        --bg-secondary: #2d2d2f;
        --bg-tertiary: #3d3d3f;
        --border: #424245;
        --text-primary: #f5f5f7;
        --text-secondary: #86868b;
        --text-tertiary: #636366;
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --selected-bg: rgba(10, 132, 255, 0.15);
        --selected-border: #0a84ff;
        --comparison-soft-bg: #323238;
        --comparison-soft-border: #4d5160;
        --comparison-emphasis-bg: rgba(10, 132, 255, 0.2);
        --comparison-selected-shadow: 0 8px 18px rgba(10, 132, 255, 0.24);
        --comparison-card-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }
    } */

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        line-height: 1.5;
      }

      /* ===== FRAME STRUCTURE ===== */
      .header {
        background: var(--bg-secondary);
        padding: 0.5rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
      }
      .header .status {
        font-size: 0.7rem;
        color: var(--success);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .header .status::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--success);
        border-radius: 50%;
      }

      .main {
        flex: 1;
        overflow-y: auto;
      }
      #claude-content {
        padding: 2rem;
        min-height: 100%;
      }

      .indicator-bar {
        background: var(--bg-secondary);
        border-top: 1px solid var(--border);
        padding: 0.5rem 1.5rem;
        flex-shrink: 0;
        text-align: center;
      }
      .indicator-bar span {
        font-size: 0.75rem;
        color: var(--text-secondary);
      }
      .indicator-bar .selected-text {
        color: var(--accent);
        font-weight: 500;
      }

      /* ===== TYPOGRAPHY ===== */
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.55rem;
      }
      h3 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        color: var(--text-secondary);
        font-size: 0.92rem;
        line-height: 1.6;
        max-width: 72ch;
        margin-bottom: 1rem;
      }
      .subtitle strong {
        color: var(--text-primary);
      }
      .section {
        margin-bottom: 1.4rem;
        border: 1px solid var(--comparison-soft-border);
        border-radius: 14px;
        background: var(--bg-secondary);
        padding: 1rem 1rem 1.1rem;
      }
      .section > :last-child {
        margin-bottom: 0;
      }
      .label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.65rem;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--comparison-soft-border);
        background: var(--comparison-soft-bg);
      }

      /* ===== OPTIONS (for A/B/C choices) ===== */
      .options {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .option {
        background: var(--bg-secondary);
        border: 1.5px solid var(--comparison-soft-border);
        border-radius: 14px;
        padding: 0.9rem 1.05rem;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
        display: flex;
        align-items: flex-start;
        gap: 0.85rem;
        position: relative;
      }
      .option:hover {
        border-color: var(--accent);
        background: var(--comparison-soft-bg);
        transform: translateY(-1px);
      }
      .option.selected {
        background: var(--comparison-emphasis-bg);
        border-color: var(--selected-border);
        box-shadow: var(--comparison-selected-shadow);
      }
      .option .content {
        flex: 1;
      }
      .option .content h3 {
        font-size: 0.95rem;
        margin-bottom: 0.15rem;
        color: var(--text-primary);
      }
      .option .content p {
        color: var(--text-secondary);
        font-size: 0.86rem;
        margin: 0;
      }

      .letter {
        background: var(--comparison-soft-bg);
        border: 1px solid var(--comparison-soft-border);
        color: var(--text-secondary);
        width: 1.85rem;
        height: 1.85rem;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.82rem;
        line-height: 1;
        flex-shrink: 0;
        letter-spacing: 0.01em;
      }
      .option.selected .letter {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      }

      .options[data-multiselect] {
        border: 1px dashed var(--comparison-soft-border);
        border-radius: 14px;
        padding: 0.7rem;
        background: var(--comparison-soft-bg);
        gap: 0.55rem;
      }
      .options[data-multiselect] .option {
        border-style: dashed;
        background: var(--bg-secondary);
      }
      .options[data-multiselect] .option.selected {
        border-color: var(--warning);
        background: rgba(255, 159, 10, 0.14);
        box-shadow: none;
      }
      .options[data-multiselect] .option.selected .letter {
        background: var(--warning);
        border-color: var(--warning);
        color: #1d1d1f;
      }

      /* ===== CARDS (for showing designs/mockups) ===== */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
      }
      .card {
        background: var(--bg-secondary);
        border: 1.5px solid var(--comparison-soft-border);
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
        box-shadow: var(--comparison-card-shadow);
      }
      .card.selected {
        border-color: var(--selected-border);
        border-width: 2px;
        background: var(--comparison-emphasis-bg);
        box-shadow: var(--comparison-selected-shadow);
      }
      .card.selected .card-body h3 {
        color: var(--accent);
      }
      .card-image {
        background: var(--bg-tertiary);
        aspect-ratio: 16/10;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-body {
        padding: 1rem;
      }
      .card-body h3 {
        margin-bottom: 0.25rem;
      }
      .card-body p {
        color: var(--text-secondary);
        font-size: 0.85rem;
      }

      /* ===== MOCKUP CONTAINER ===== */
      .mockup {
        background: var(--bg-secondary);
        border: 1.5px solid var(--comparison-soft-border);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 1rem;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .mockup-header {
        background: var(--comparison-soft-bg);
        padding: 0.55rem 1rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--comparison-soft-border);
      }
      .mockup-body {
        padding: 1.3rem;
      }

      /* ===== SPLIT VIEW (side-by-side comparison) ===== */
      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      @media (max-width: 700px) {
        .split {
          grid-template-columns: 1fr;
        }
      }

      /* ===== PROS/CONS ===== */
      .pros-cons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1rem 0;
      }
      .pros,
      .cons {
        background: var(--bg-secondary);
        border-radius: 8px;
        padding: 1rem;
      }
      .pros h4 {
        color: var(--success);
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }
      .cons h4 {
        color: var(--error);
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }
      .pros ul,
      .cons ul {
        margin-left: 1.25rem;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }
      .pros li,
      .cons li {
        margin-bottom: 0.25rem;
      }

      /* ===== PLACEHOLDER (for mockup areas) ===== */
      .placeholder {
        background: var(--bg-tertiary);
        border: 2px dashed var(--border);
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        color: var(--text-tertiary);
      }

      /* ===== INLINE MOCKUP ELEMENTS ===== */
      .mock-nav {
        background: var(--accent);
        color: white;
        padding: 0.75rem 1rem;
        display: flex;
        gap: 1.5rem;
        font-size: 0.9rem;
      }
      .mock-sidebar {
        background: var(--bg-tertiary);
        padding: 1rem;
        min-width: 180px;
      }
      .mock-content {
        padding: 1.5rem;
        flex: 1;
      }
      .mock-button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .mock-input {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>
        <a
          href="https://github.com/obra/superpowers"
          style="color: inherit; text-decoration: none"
          >Superpowers Brainstorming</a
        >
      </h1>
      <div class="status">Connected</div>
    </div>

    <div class="main">
      <div id="claude-content" data-comparison-kit="fragment-shell">
        <!-- CONTENT -->
      </div>
    </div>

    <div class="indicator-bar">
      <span id="indicator-text" role="status" aria-live="polite"
        >Click an option above to confirm the current selection, then return to
        the terminal</span
      >
    </div>
  </body>
</html>
